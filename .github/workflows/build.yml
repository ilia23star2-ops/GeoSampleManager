name: Build & Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ============================================================
      # 1. Указываем GitHub, какую версию Android SDK использовать.
      #    Это исправляет ошибку "Setup Android SDK".
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16.0' # или 'latest', если не сработает

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ============================================================
      # 2. Юнит-тесты (src/test/). Если падают — шаг красный, дальше
      #    сборка не идёт.
      # ============================================================
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # ============================================================
      # 3. Сборка debug APK.
      # ============================================================
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ============================================================
      # 4. Артефакты — доступны на странице запуска Actions.
      # ============================================================
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/