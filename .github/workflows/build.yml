name: Build & Test

# ============================================================
# CI запускается ВРУЧНУЮ: вкладка Actions → Build & Test →
# кнопка «Run workflow». Автозапуск по push / PR отключён.
#
# При запуске можно выбрать:
#   • Run unit tests  — прогнать юнит-тесты (по умолчанию ДА).
#   • Build Debug APK — собрать debug APK (по умолчанию НЕТ).
#     При сборке APK модель Vosk скачивается из релиза models-v1
#     и распаковывается в app/src/main/assets/.
#
# FIX 5.8.9-infra-2d: ручной запуск вместо автоматического.
# FIX 5.8.9-infra-2e: выкачка модели Vosk из релиза.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Запустить юнит-тесты'
        type: boolean
        default: true
        required: false
      build_apk:
        description: 'Собрать Debug APK'
        type: boolean
        default: false
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ============================================================
      # Юнит-тесты — по чек-боксу «Run unit tests».
      # ============================================================
      - name: Run unit tests
        if: ${{ inputs.run_tests }}
        run: ./gradlew testDebugUnitTest --stacktrace

      # ============================================================
      # FIX 5.8.9-infra-2e: скачиваем модель Vosk из релиза models-v1
      # и распаковываем в app/src/main/assets/.
      #
      # Архив содержит папку vosk-model-small-ru-0.22/.
      # После распаковки путь: app/src/main/assets/vosk-model-small-ru-0.22/
      #
      # Шаг выполняется только при build_apk=true.
      # ============================================================
      - name: Download & Unpack Vosk model
        if: ${{ inputs.build_apk }}
        run: |
          cd app/src/main/assets
          curl -L -o vosk-model.zip \
            "https://github.com/ilia23star2-ops/GeoSampleManager/releases/download/models-v1/vosk-model-small-ru-0.22.zip"
          unzip -q vosk-model.zip
          rm vosk-model.zip
          ls -la

      # ============================================================
      # Сборка Debug APK — по чек-боксу «Build Debug APK».
      # ============================================================
      - name: Build Debug APK
        if: ${{ inputs.build_apk }}
        run: ./gradlew assembleDebug --stacktrace

      # ============================================================
      # Артефакты — только если соответствующий шаг выполнялся.
      # ============================================================
      - name: Upload APK
        if: ${{ inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test report
        if: ${{ inputs.run_tests }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/