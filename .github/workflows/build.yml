name: Build & Test

# ============================================================
# FIX 5.8.11-ci-automation:
#
# Юнит-тесты — АВТОМАТИЧЕСКИ на PR в main и feature/*.
#   Если в PR только документация — тесты пропускаются,
#   job всё равно проходит (зелёный), чтобы branch protection
#   не висел в ожидании.
#
# APK — ПО ЛЕЙБЛУ `build-apk` на PR.
#   Повесил лейбл на PR → собралось APK, попало в артефакты.
#   Снял и снова повесил → пересборка.
#
# Ручной запуск — сохранён (Actions → Run workflow).
#
# FIX 5.8.9-infra-2d: ручной запуск вместо автоматического.
# FIX 5.8.9-infra-2e: выкачка модели Vosk из релиза.
# FIX 5.8.9-infra-2e-fix-1: mkdir -p app/src/main/assets.
# FIX 5.8.9f-2c: mv vosk-model-small-ru-0.22 → vosk-model-small-ru.
# ============================================================

on:
  pull_request:
    branches:
      - main
      - 'feature/**'
    types: [opened, synchronize, reopened, labeled]

  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Запустить юнит-тесты'
        type: boolean
        default: true
        required: false
      build_apk:
        description: 'Собрать Debug APK'
        type: boolean
        default: false
        required: false

jobs:
  # ============================================================
  # Юнит-тесты.
  #
  # Запускается:
  #   • на PR (opened / synchronize / reopened) — автоматически,
  #     кроме события labeled (чтобы лейбл build-apk не гонял тесты);
  #   • вручную через workflow_dispatch при run_tests = true.
  #
  # Если в PR изменены только документы — gradle-шаги пропускаются,
  # job остаётся зелёным. Это нужно для branch protection.
  # ============================================================
  unit-tests:
    if: |
      github.event_name == 'workflow_dispatch' && inputs.run_tests ||
      github.event_name == 'pull_request' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect code changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'app/src/**'
              - 'app/build.gradle'
              - '**/*.gradle'
              - '**/*.gradle.kts'
              - 'gradle/**'
              - 'settings.gradle'
              - 'settings.gradle.kts'
              - 'build.gradle'
              - 'build.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/**'

      - name: Set up JDK 17
        if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        run: chmod +x gradlew

      - name: Run unit tests
        if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always() && (steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Docs-only — тесты пропущены
        if: github.event_name == 'pull_request' && steps.filter.outputs.code != 'true'
        run: echo "Только документация — юнит-тесты пропущены."

  # ============================================================
  # Сборка Debug APK.
  #
  # Запускается:
  #   • на PR при добавлении лейбла `build-apk`;
  #   • вручную через workflow_dispatch при build_apk = true.
  #
  # Модель Vosk выкачивается из релиза models-v1,
  # распаковывается в app/src/main/assets/.
  # ============================================================
  build-apk:
    if: |
      github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'build-apk' ||
      github.event_name == 'workflow_dispatch' && inputs.build_apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download & Unpack Vosk model
        run: |
          mkdir -p app/src/main/assets
          cd app/src/main/assets
          curl -L -o vosk-model.zip \
            "https://github.com/ilia23star2-ops/GeoSampleManager/releases/download/models-v1/vosk-model-small-ru-0.22.zip"
          unzip -q vosk-model.zip
          mv vosk-model-small-ru-0.22 vosk-model-small-ru
          rm vosk-model.zip
          ls -la

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
